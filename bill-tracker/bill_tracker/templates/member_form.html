{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Edit {{ member.name }}{% endblock %}
{% block content %}
<h1>Edit {{ member.name }}</h1>
<form method="post" class="card form">
  {{ csrf() }}
  {% include "_member_fields.html" %}
  <div class="actions">
    <button class="btn" type="submit">Save</button>
    <a class="btn btn-ghost" href="{{ url_for('members') }}">Cancel</a>
  </div>
</form>
<form method="post" action="{{ url_for('delete_member', member_id=member.id) }}" class="danger-zone"
      onsubmit='return confirm({{ ("Remove " ~ member.name ~ "? Their bills stay on the list.")|tojson }});'>
  {{ csrf() }}
  <button class="link danger" type="submit">Remove {{ member.name }}</button>
</form>
{% endblock %}
